<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>risk-bench</title>
<style>
  :root { --bg:#f6f6f4; --panel:#ffffff; --line:#e3e2de; --ink:#1f2329; --dim:#6e747d; --accent:#44546a;
          --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.55 var(--sans); }
  .wrap { max-width: 980px; margin: 0 auto; padding: 32px 16px; }
  h1 { font: 700 22px var(--sans); margin: 0 0 4px; letter-spacing:-.01em; }
  h1 .dice { color: var(--accent); }
  .subtitle { color: var(--dim); margin-bottom: 28px; }
  h2 { font: 600 12px var(--sans); text-transform: uppercase; letter-spacing: .1em; color: var(--dim);
       margin: 30px 0 10px; border-bottom: 1px solid var(--line); padding-bottom: 5px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; color: var(--dim); font-weight: 600; font-size: 11px; text-transform: uppercase;
       letter-spacing: .07em; padding: 6px 10px; border-bottom: 1.5px solid #c9c8c3; }
  td { padding: 8px 10px; border-bottom: 1px solid var(--line); }
  tr.game { cursor: pointer; }
  tr.game:hover td { background: #f0efec; }
  tr:last-child td { border-bottom: none; }
  .status { font-size: 11px; padding: 1px 8px; border-radius: 9px; letter-spacing:.02em;
            white-space: nowrap; display: inline-block; }
  th.colStatus { min-width: 150px; }
  td.num { white-space: nowrap; }
  .status.live { background: #e2efe1; color: #2e6b34; animation: runningPulse 1.4s ease-in-out infinite; }
  @keyframes runningPulse { 50% { opacity: .45; } }
  .status.done { background: #ececea; color: var(--dim); }
  .status.paused { background: #f5ecd2; color: #8a6d1f; }
  .winner { color: #2e6b34; font-weight: 600; }
  .mic { color: var(--accent); }
  .empty { color: var(--dim); padding: 12px 10px; }
  .row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  label { color: var(--dim); font-size: 12px; }
  select, input[type=number], input[type=text] {
    background: #fff; color: var(--ink); border: 1px solid #c6c5c0; border-radius: 5px;
    padding: 6px 8px; font: 13px var(--sans); }
  button { background: var(--accent); color: #ffffff; border: 1px solid var(--accent); border-radius: 5px;
           padding: 8px 16px; font: 600 13px var(--sans); cursor: pointer; }
  button:hover { filter: brightness(1.12); }
  button.subtle { background: var(--panel); color: var(--ink); border-color: #c6c5c0; font-weight: 400; }
  button.subtle:hover { background: #f0efec; filter: none; }
  button.tiny { padding: 2px 8px; font-size: 12px; }
  #launchError { color: #b02a1f; margin-top: 8px; white-space: pre-wrap; }
  .playerRow { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .playerRow .seat { color: var(--dim); width: 48px; font-size: 12px; text-transform: uppercase;
                     letter-spacing:.04em; }
  tr.child td { background: #fbfbfa; }
  tr.child td:first-child { padding-left: 28px; color: var(--dim); }
  .caret { color: var(--dim); font-size: 11px; margin-right: 6px; }
  .trophy { margin-right: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="dice">⚂</span> risk-bench</h1>
  <div class="subtitle">A benchmark of strategy, diplomacy, and deception: language models playing the board game Risk.</div>

  <h2>New game</h2>
  <div class="panel">
    <div id="playerRows"></div>
    <div class="row">
      <button class="subtle" id="addPlayer">+ add player</button>
    </div>
    <div class="row">
      <label>commentator <select id="commentator"></select></label>
      <label>seed <input type="number" id="seed" value="0" style="width:90px"></label>
      <label>max turns <input type="number" id="maxTurns" placeholder="default" style="width:90px"></label>
      <label title="above 1 launches a tournament: the same setup replicated on consecutive seeds">
        parallel games <input type="number" id="parallelGames" value="1" min="1" max="20" style="width:70px"></label>
      <button id="launch">▶ start game</button>
    </div>
    <div id="launchError"></div>
  </div>

  <h2>Games</h2>
  <div class="panel">
    <table>
      <thead><tr><th>started</th><th>players</th><th class="colStatus">status</th><th>winner</th>
        <th>turn</th><th>tokens in / out</th><th>est. cost</th><th></th></tr></thead>
      <tbody id="games"><tr><td class="empty" colspan="8">Loading…</td></tr></tbody>
    </table>
  </div>
</div>
<script>
const el = id => document.getElementById(id);
let specOptions = [];

async function loadModels() {
  const catalog = await (await fetch("/api/models")).json();
  specOptions = [catalog.baseline];
  for (const [provider, tiers] of Object.entries(catalog.tiers_by_provider)) {
    for (const [tier, modelId] of Object.entries(tiers)) {
      specOptions.push(`${provider}:${tier}`);
    }
  }
  el("commentator").innerHTML = '<option value="">none</option>' +
    specOptions.filter(spec => spec !== "random")
      .map(spec => `<option value="${spec}">${spec}</option>`).join("");
  addPlayerRow(); addPlayerRow(); addPlayerRow();
}

function addPlayerRow() {
  const rows = el("playerRows");
  if (rows.children.length >= 6) return;
  const row = document.createElement("div");
  row.className = "playerRow";
  row.innerHTML = `<span class="seat">seat ${rows.children.length + 1}</span>
    <select class="playerSpec">${specOptions.map(spec => `<option value="${spec}">${spec}</option>`).join("")}</select>
    <input type="text" class="customSpec" placeholder="or custom provider:model" style="flex:1">
    <button class="subtle remove">✕</button>`;
  row.querySelector(".remove").onclick = () => { if (rows.children.length > 3) { row.remove(); renumber(); } };
  rows.appendChild(row);
}

function renumber() {
  document.querySelectorAll("#playerRows .seat")
    .forEach((seat, i) => seat.textContent = `seat ${i + 1}`);
}

async function launch() {
  el("launchError").textContent = "";
  const players = [...document.querySelectorAll(".playerRow")].map(row =>
    row.querySelector(".customSpec").value.trim() || row.querySelector(".playerSpec").value);
  const body = {
    players,
    seed: Number(el("seed").value) || 0,
    commentator: el("commentator").value || null,
    max_turns: el("maxTurns").value ? Number(el("maxTurns").value) : null,
    parallel_games: Number(el("parallelGames").value) || 1,
  };
  el("launch").disabled = true;
  el("launch").textContent = "starting…";
  try {
    const response = await fetch("/api/games", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
    });
    const payload = await response.json();
    if (!response.ok) throw new Error(payload.detail ?? JSON.stringify(payload));
    if (payload.tournament) {
      expandedTournaments.add(payload.id);
      el("launch").disabled = false;
      el("launch").textContent = "▶ start game";
      loadGames();
    } else {
      location.href = `/games/${payload.id}`;
    }
  } catch (error) {
    el("launchError").textContent = String(error.message ?? error);
    el("launch").disabled = false;
    el("launch").textContent = "▶ start game";
  }
}

async function gameAction(event, gameId, action) {
  event.stopPropagation();
  const response = await fetch(`/api/games/${gameId}/${action}`, { method: "POST" });
  if (!response.ok) {
    const payload = await response.json().catch(() => ({}));
    alert(payload.detail ?? `Could not ${action} the game.`);
  }
  loadGames();
}

const expandedTournaments = new Set();

function toggleTournament(tournamentId) {
  if (expandedTournaments.has(tournamentId)) expandedTournaments.delete(tournamentId);
  else expandedTournaments.add(tournamentId);
  loadGames();
}

const compact = n => n == null ? null
  : n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "k" : String(n);
const tokensCell = (inputTokens, outputTokens) =>
  inputTokens == null ? "—" : `${compact(inputTokens)} / ${compact(outputTokens)}`;
const costCell = cost => cost == null ? "—" : `$${cost.toFixed(2)}`;

function gameRow(game, child) {
  const started = new Date(game.modified_at).toLocaleString();
  const status = game.finished
    ? '<span class="status done">finished</span>'
    : game.running
      ? '<span class="status live">● running</span>'
      : '<span class="status paused">⏸ paused</span>';
  const control = game.finished ? "" : game.running
    ? `<button class="tiny subtle" onclick="gameAction(event, '${game.id}', 'pause')">⏸ pause</button>`
    : `<button class="tiny" onclick="gameAction(event, '${game.id}', 'resume')">▶ resume</button>`;
  const winner = game.winner ? `<span class="winner">${game.winner}</span>` : (game.finished ? "draw" : "—");
  const mic = game.has_commentary ? ' <span class="mic" title="commentated">🎙️</span>' : "";
  const first = child ? `seed ${game.seed}` : started;
  const players = child ? `${game.id}${mic}` : `${game.players.join(", ")}${mic}`;
  const turn = game.turn_count == null ? "—" : game.finished ? game.turn_count : `${game.turn_count}…`;
  return `<tr class="game${child ? " child" : ""}" onclick="location.href='/games/${game.id}'">
    <td>${first}</td><td>${players}</td>
    <td>${status}</td><td>${winner}</td><td class="num">${turn}</td>
    <td class="num">${tokensCell(game.input_tokens, game.output_tokens)}</td>
    <td class="num">${costCell(game.cost_usd)}</td><td>${control}</td></tr>`;
}

function tournamentRows(tournament, games) {
  const expanded = expandedTournaments.has(tournament.id);
  const running = games.filter(game => game.running).length;
  const finished = games.filter(game => game.finished).length;
  const paused = games.length - running - finished;
  const status = [
    running ? `<span class="status live">● ${running} running</span>` : "",
    paused ? `<span class="status paused">⏸ ${paused} paused</span>` : "",
    finished ? `<span class="status done">${finished} finished</span>` : "",
  ].filter(Boolean).join(" ");
  const winTally = {};
  games.forEach(game => { if (game.winner) winTally[game.winner] = (winTally[game.winner] || 0) + 1; });
  const winners = Object.entries(winTally).sort((a, b) => b[1] - a[1])
    .map(([name, wins]) => `<span class="winner">${name}</span>${wins > 1 ? ` ×${wins}` : ""}`).join(", ") || "—";
  const mic = games.some(game => game.has_commentary) ? ' <span class="mic" title="commentated">🎙️</span>' : "";
  const started = new Date(tournament.created_at).toLocaleString();
  const totalOrNull = values => values.some(v => v != null) ? values.reduce((sum, v) => sum + (v ?? 0), 0) : null;
  const inputTokens = totalOrNull(games.map(game => game.input_tokens));
  const outputTokens = totalOrNull(games.map(game => game.output_tokens));
  const cost = totalOrNull(games.map(game => game.cost_usd));
  const header = `<tr class="game" onclick="toggleTournament('${tournament.id}')">
    <td><span class="caret">${expanded ? "▾" : "▸"}</span>${started}</td>
    <td><span class="trophy">🏆</span>${tournament.players.join(", ")}${mic}
      <span style="color:var(--dim)"> — ${games.length} games</span></td>
    <td>${status}</td><td>${winners}</td><td></td>
    <td class="num">${tokensCell(inputTokens, outputTokens)}</td>
    <td class="num">${costCell(cost)}</td>
    <td><button class="tiny subtle"
      onclick="event.stopPropagation();location.href='/tournaments/${tournament.id}'">📊 stats</button></td></tr>`;
  return header + (expanded ? games.map(game => gameRow(game, true)).join("") : "");
}

async function loadGames() {
  const payload = await (await fetch("/api/games")).json();
  const body = el("games");
  if (!payload.games.length) {
    body.innerHTML = '<tr><td class="empty" colspan="8">No games yet — start one above.</td></tr>';
    return;
  }
  const gamesByTournament = {};
  const standaloneGames = [];
  for (const game of payload.games) {
    if (game.tournament_id) (gamesByTournament[game.tournament_id] ??= []).push(game);
    else standaloneGames.push(game);
  }
  Object.values(gamesByTournament).forEach(games =>
    games.sort((a, b) => a.id.localeCompare(b.id, undefined, { numeric: true })));
  const entries = [
    ...payload.tournaments.map(tournament => ({
      time: tournament.created_at,
      html: tournamentRows(tournament, gamesByTournament[tournament.id] ?? []),
    })),
    ...standaloneGames.map(game => ({ time: game.modified_at, html: gameRow(game, false) })),
  ].sort((a, b) => new Date(b.time) - new Date(a.time));
  body.innerHTML = entries.map(entry => entry.html).join("");
}

el("addPlayer").onclick = addPlayerRow;
el("launch").onclick = launch;
loadModels(); loadGames();
setInterval(loadGames, 5000);
</script>
</body>
</html>
