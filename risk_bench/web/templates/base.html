<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Risk-Bench{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; }
        header { background: #1a1f2e; border-bottom: 1px solid #2d3748; padding: 1rem 2rem; display: flex; align-items: center; gap: 2rem; }
        header h1 { font-size: 1.4rem; font-weight: 700; color: #f59e0b; letter-spacing: 0.05em; }
        nav a { color: #94a3b8; text-decoration: none; font-size: 0.95rem; padding: 0.4rem 0.8rem; border-radius: 6px; transition: all 0.15s; }
        nav a:hover { background: #2d3748; color: #e2e8f0; }
        main { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        h2 { font-size: 1.5rem; font-weight: 600; margin-bottom: 1.5rem; color: #f1f5f9; }
        h3 { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.75rem; color: #cbd5e1; }
        table { width: 100%; border-collapse: collapse; background: #1a1f2e; border-radius: 8px; overflow: hidden; }
        th { background: #2d3748; color: #94a3b8; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; padding: 0.75rem 1rem; text-align: left; }
        td { padding: 0.75rem 1rem; border-bottom: 1px solid #2d3748; font-size: 0.9rem; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #243044; }
        .badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
        .badge-gold { background: #78350f; color: #fbbf24; }
        .badge-silver { background: #374151; color: #d1d5db; }
        .badge-provider { background: #1e3a5f; color: #60a5fa; }
        a { color: #60a5fa; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .card { background: #1a1f2e; border: 1px solid #2d3748; border-radius: 8px; padding: 1.5rem; margin-bottom: 1.5rem; }
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
        .stat { background: #1a1f2e; border: 1px solid #2d3748; border-radius: 8px; padding: 1rem; text-align: center; }
        .stat-value { font-size: 1.8rem; font-weight: 700; color: #f59e0b; }
        .stat-label { font-size: 0.75rem; color: #64748b; margin-top: 0.25rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .chat-log { background: #0d1117; border: 1px solid #2d3748; border-radius: 8px; padding: 1rem; max-height: 400px; overflow-y: auto; font-family: monospace; font-size: 0.85rem; }
        .chat-entry { padding: 0.25rem 0; border-bottom: 1px solid #1e2533; }
        .chat-entry:last-child { border-bottom: none; }
        .chat-from { color: #f59e0b; font-weight: 600; }
        .chat-event { color: #64748b; font-size: 0.75rem; }
        .elo { font-weight: 700; color: #34d399; }
    </style>
</head>
<body>
    <header>
        <h1>⚔️ Risk-Bench</h1>
        <nav>
            <a href="/">Leaderboard</a>
            <a href="/games">Games</a>
            <a href="/api/leaderboard">API</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
